name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  multiarch-smoke:
    name: Build multi-arch (amd64 + s390x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke image for linux/amd64 and linux/s390x
        uses: docker/build-push-action@v6
        with:
          context: bench/images/smoke
          platforms: linux/amd64,linux/s390x
          push: false
          tags: serverless-s390x/smoke:ci

  docs-check:
    name: Check docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs exist
        run: |
          test -f README.md
          test -f docs/estado-del-arte.md
          test -f LICENSE
